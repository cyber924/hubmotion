<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>내 프로젝트 | Hub모션</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">hub<span>motion</span><b>.</b></a><nav><a href="/">모션 만들기</a><a href="/#templateSection">템플릿</a><a href="/projects">내 프로젝트</a><a href="/gallery">공개 갤러리</a><a href="/prompts">프롬프트</a><a href="/solutions">솔루션</a></nav><div class="headright"><span id="account"></span><a class="outline" href="/">스튜디오로</a></div></header><main class="projects-page"><div class="section-intro"><div><div class="eyebrow">YOUR CREATIONS</div><h1>내 프로젝트<span class="dot">.</span></h1><p>만든 모션을 보관하고 공개 갤러리에 배포하세요.</p></div><a href="/" class="btn primary">새 모션 만들기 ↗</a></div><div id="notice" class="hint">목록을 불러오는 중입니다.</div><div id="projectsGrid" class="projects-grid"></div></main><dialog id="publishDialog"><div class="dialogtop"><h3>공개 갤러리에 배포</h3><button id="closePublish">✕</button></div><p>작품 정보와 저장된 녹음·음악·자막은 방문자에게 공개됩니다.</p><label>테마<select id="publishTheme"><option>여행</option><option>제품</option><option>브랜드</option><option>교육</option><option>음식</option><option>패션</option><option>서비스 소개</option><option>기타</option></select></label><label>작품 소개<textarea id="description" maxlength="1200" placeholder="작품에 관한 소개를 작성해주세요."></textarea></label><div class="ai-description"><button type="button" class="btn light" id="suggestDescription">✳ AI 소개 추천</button><span id="suggestStatus">추천 내용을 직접 수정할 수 있습니다.</span></div><label>제작자 이름<input id="author" placeholder="갤러리에 표시할 이름"></label><button id="confirmPublish" class="btn dark">공개 배포하기</button><p id="publishStatus" class="error"></p></dialog><dialog id="deleteDialog"><div class="dialogtop"><h3>프로젝트 삭제</h3><button id="closeDelete">✕</button></div><p>프로젝트와 공개 갤러리 게시물을 삭제합니다. 삭제한 프로젝트는 복구할 수 없습니다. 첨부 원본 파일은 Storage에 남습니다.</p><button class="btn dark" id="confirmDelete">삭제하기</button><p id="deleteStatus" class="error"></p></dialog><script src="/projects.js"></script></body></html>
